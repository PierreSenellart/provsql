# Talks and tutorials about ProvSQL, or that present it. Entries are
# shown in the order below within each kind, so keep them newest first.
#
# Fields: title, date (YYYY-MM-DD), kind (outreach | tutorial | research),
# venue, slides (URL), description; optional: language (ISO code, when not
# English), paper_pdf, paper_doi, video, and also (a list of {venue, date,
# slides} for later or earlier deliveries of the same talk).

- title: "D'où viennent les données ? La science de la provenance"
  date: 2026-09-25
  kind: outreach
  language: fr
  venue: "La Nuit des données, École normale supérieure, Paris"
  slides: "https://pierre.senellart.com/talks/nuit-20260925.pdf"
  description: "A general-audience talk, in French, on why the numbers we read come with no trace of how they were produced, and what data provenance can do about it. From crowd-count estimates and spreadsheet errors to the semiring view of provenance, probabilities, and the Shapley value, with ProvSQL and ProvSQL Studio shown at work."

- title: "Provenance of HAVING Queries in Semirings with Monus"
  date: 2026-08-12
  kind: research
  venue: "Nanyang Technological University, Singapore"
  slides: "https://pierre.senellart.com/talks/ntu-20260812.pdf"
  description: "A possible-world semantics for the provenance of HAVING queries in semirings with monus, its properties, the algorithms behind it, and its implementation and experimental evaluation in ProvSQL."

- title: "Optimizing Probabilistic Query Evaluation in ProvSQL"
  date: 2026-06-30
  kind: research
  venue: "SinFra Symposium 2026, A*STAR, Singapore"
  slides: "https://pierre.senellart.com/talks/sinfra-20260630.pdf"
  description: "How ProvSQL computes answer probabilities efficiently although the problem is #P-hard in general: from Boolean provenance to tractable cases, knowledge compilation, and the choice of an evaluation method."

- title: "Efficiency and Effectiveness of a Practical Provenance and Probabilistic DBMS"
  date: 2025-01-23
  kind: research
  venue: "Logic and Algorithms in DB Theory and AI Reunion, Simons Institute, Berkeley"
  slides: "https://pierre.senellart.com/talks/simons-20250123.pdf"
  description: "Can a DBMS support several forms of provenance, a large and useful query language, and efficient computation of provenance and probabilities? ProvSQL's design and its benchmarks against other provenance and probabilistic systems."

- title: "On the Impact of Val on Pierre & ProvSQL"
  date: 2024-05-25
  kind: research
  venue: "ValFest 2024, University of Pennsylvania, Philadelphia"
  slides: "https://pierre.senellart.com/talks/valfest-20240525.pdf"
  paper_pdf: "https://pierre.senellart.com/publications/senellart2024impact.pdf"
  paper_doi: "10.4230/OASICS.TANNEN.9"
  description: "How the provenance semiring framework of Green, Karvounarakis, and Tannen shaped the design of ProvSQL, from its origins in 2016 to its state in 2024."

- title: "Expected Shapley-Like Scores of Boolean Functions: Complexity and Applications to Probabilistic Databases"
