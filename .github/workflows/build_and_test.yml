name: Linux

on:
  push:
    branches: [master]
    tags: ['v*']
    paths-ignore:
      - 'doc/**'
      - 'website/**'
      - 'branding/**'
      - 'studio/**'
      - 'wasm/**'
      - 'test/bench/**'
      - '*.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/pull_request_template.md'
      - 'CITATION.cff'
      - 'LICENSE'
      - 'META.json'
      - 'release.sh'
      - '.github/workflows/codeql.yml'
      - '.github/workflows/docs.yml'
      - '.github/workflows/macos.yml'
      - '.github/workflows/pgxn.yml'
      - '.github/workflows/studio.yml'
      - '.github/workflows/studio-release.yml'
      - '.github/workflows/wsl.yml'
      - '.github/workflows/wasm.yml'
  pull_request:
    paths-ignore:
      - 'doc/**'
      - 'website/**'
      - 'branding/**'
      - 'studio/**'
      - 'wasm/**'
      - 'test/bench/**'
      - '*.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/pull_request_template.md'
      - 'CITATION.cff'
      - 'LICENSE'
      - 'META.json'
      - 'release.sh'
      - '.github/workflows/codeql.yml'
      - '.github/workflows/docs.yml'
      - '.github/workflows/macos.yml'
      - '.github/workflows/pgxn.yml'
      - '.github/workflows/studio.yml'
      - '.github/workflows/studio-release.yml'
      - '.github/workflows/wsl.yml'
      - '.github/workflows/wasm.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Skip tests on tag pushes: the same commit was already tested on master
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    strategy:
      matrix:
        pg: [18, 17, 16, 15, 14, 13, 12, 11]
    name: 🐘 PostgreSQL ${{ matrix.pg }}
    runs-on: ubuntu-latest
    container: pgxn/pgxn-tools
    steps:
      - run: pg-start ${{ matrix.pg }} libgraph-easy-perl libboost-dev libboost-serialization-dev unzip zlib1g-dev libgmp-dev python3
      - run: pg_dropcluster ${{ matrix.pg }} main
      # Full history + tags are needed so Makefile.internal's
      # `git describe --tags` resolves LATEST_RELEASE and the
      # extension_upgrade regression test is included in the schedule.
      - uses: actions/checkout@v7
        with:
          fetch-tags: true
          fetch-depth: 0
      - uses: ./.github/actions/install-knowledge-compilers
      - run: make -j$(nproc) && make tdkc && make provsql_migrate_mmap && make install
      - name: KCMCP protocol conformance (tdkc)
        run: make test-kcmcp
      - run: echo "shared_preload_libraries = 'provsql'" >> /etc/postgresql/${{ matrix.pg }}/test/postgresql.conf
      - run: service postgresql restart
      - run: pg_isready -t 30
      # provsql.verify_rewrite checks the query tree after every pass of the
      # rewriting: an inconsistency is an error naming the pass, not a
      # malfunction far from it.  It changes no output of a clean run.
      - run: PGUSER=postgres PGOPTIONS="-c provsql.verify_rewrite=on" bash test/kcmcp/with-tdkc.sh make installcheck PGUSER=postgres || bash -c "shopt -s nullglob; cat /tmp/tmp.provsql*/regression.diffs && for i in /tmp/provsql*; do echo $i && cat $i; done; false"

  # The same tests on arm64, for the latest PostgreSQL only. The
  # pgxn/pgxn-tools image used above exists for amd64 only, so this job runs
  # on the bare runner, with PostgreSQL from the PGDG repository. The
  # external knowledge compilers are not installed: they are not part of
  # ProvSQL, and the tests that need them skip cleanly.
  test-arm64:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    name: 🐘 PostgreSQL 18 (arm64)
    runs-on: ubuntu-24.04-arm
    env:
      PG_CONFIG: /usr/lib/postgresql/18/bin/pg_config
    steps:
      - run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-18 postgresql-server-dev-18 libpq-dev libgraph-easy-perl libboost-dev libboost-serialization-dev unzip zlib1g-dev libgmp-dev python3
      # Start from a single PostgreSQL 18 cluster on the default port,
      # whatever clusters the image or the package installation created.
      - run: |
          pg_lsclusters -h | while read -r ver name _; do sudo pg_dropcluster --stop "$ver" "$name"; done
          sudo pg_createcluster 18 main -p 5432
          echo "shared_preload_libraries = 'provsql'" | sudo tee -a /etc/postgresql/18/main/postgresql.conf
          sudo sed -i 's/^\(local\s.*\)peer$/\1trust/' /etc/postgresql/18/main/pg_hba.conf
      - uses: actions/checkout@v7
        with:
          fetch-tags: true
          fetch-depth: 0
      - run: make -j$(nproc) PG_CONFIG=$PG_CONFIG && make tdkc PG_CONFIG=$PG_CONFIG && make provsql_migrate_mmap PG_CONFIG=$PG_CONFIG && sudo make install PG_CONFIG=$PG_CONFIG
      - name: KCMCP protocol conformance (tdkc)
        run: make test-kcmcp PG_CONFIG=$PG_CONFIG
      - run: sudo pg_ctlcluster 18 main start
      - run: pg_isready -t 30
      - run: PGUSER=postgres PGOPTIONS="-c provsql.verify_rewrite=on" bash test/kcmcp/with-tdkc.sh make installcheck PG_CONFIG=$PG_CONFIG PGUSER=postgres || bash -c "shopt -s nullglob; cat /tmp/tmp.provsql*/regression.diffs && for i in /tmp/provsql*; do echo $i && cat $i; done; false"

  docker:
    needs: test
    # always() is needed so this condition is evaluated even when
    # the test job is skipped (tag pushes); see
    # https://docs.github.com/en/actions/writing-workflows/choosing-what-your-workflow-does/using-jobs-in-a-workflow
    if: |
      always() &&
      (needs.test.result == 'success' || needs.test.result == 'skipped') &&
      (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')) &&
      github.repository == 'PierreSenellart/provsql'
    environment: master_branch
    runs-on: ubuntu-latest
    steps:
      # build-push-action builds from the remote Git context, but the
      # dockerhub-description step below reads docker/README.md from the
      # workspace, so the job needs a checkout.
      - uses: actions/checkout@v7
      - name: Determine version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "provsql_version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "provsql_version=dev" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: inriavalda
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          file: docker/Dockerfile
          push: true
          tags: >-
            inriavalda/provsql:latest${{
              steps.version.outputs.provsql_version != 'dev'
              && format(',inriavalda/provsql:{0}', steps.version.outputs.provsql_version)
              || ''
            }}
          build-args: |
            PROVSQL_VERSION=${{ steps.version.outputs.provsql_version }}
      # Keep the Docker Hub overview in sync with docker/README.md. No extra
      # gate: this runs whenever the image is pushed (master + tags), so the
      # overview always describes the :latest that was just published.
      # NOTE: editing the description needs a token allowed to do so; the
      # push-scoped DOCKERHUB_TOKEN may 403 here, in which case use an
      # org-admin / account PAT (a separate secret).
      - uses: peter-evans/dockerhub-description@v5
        with:
          username: inriavalda
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: inriavalda/provsql
          short-description: "(m-)semiring provenance & uncertainty management for PostgreSQL"
          readme-filepath: ./docker/README.md
